# Advisory checks. These are deliberately NOT in ci.yml and must never be added to the required
# status checks until the codebase is clean enough for them to pass.
#
# On why this is a separate workflow rather than `continue-on-error: true` in ci.yml:
# continue-on-error makes GitHub report the job as *successful*. The PR then says "all checks
# have passed", the annotation goes unread, and if the job is later promoted to required it is
# structurally incapable of failing. A separate, non-required workflow fails honestly — a red X
# on the PR — while branch protection, which blocks only on the check names you list, still lets
# the merge through. Visible but not blocking is what advisory should mean.
#
# Promotion path: when a check here goes green and stays green, delete its job from this file and
# add the equivalent step to the matching job in ci.yml. That promotes it to blocking without
# touching branch protection, because the required check name (API / UI) does not change.

name: Quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 6
    defaults:
      run:
        working-directory: money-manager-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: money-manager-ui/package-lock.json
      - run: npm ci

      # Errors already block here (the job fails); the warnings are the shrinking backlog.
      # Promotion: when `npm run lint -- --max-warnings 0` passes, delete this job and add the
      # step to the UI job in ci.yml. Required check names do not change, so branch protection
      # needs no edit.
      - run: npm run lint

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 6
    defaults:
      run:
        working-directory: money-manager-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: money-manager-ui/package-lock.json
      - run: npm ci
      - run: npm run test:coverage

      # One number on the run summary, so "is this improving?" is answerable at a glance rather
      # than by opening logs. An advisory check nobody can read at a glance becomes wallpaper.
      # Heredoc delimiter is quoted so the shell expands nothing — the script is full of ${...}
      # that belongs to JavaScript, not to bash.
      - name: Report coverage
        if: always()
        run: |
          cat > /tmp/summary.cjs <<'EOF'
          const t = require(process.argv[2]).total;
          const rows = ['statements', 'branches', 'functions', 'lines']
            .map((k) => `| ${k} | ${t[k].pct}% | ${t[k].covered}/${t[k].total} |`);
          console.log(['### UI coverage', '', '| Metric | % | Covered |', '|---|---|---|', ...rows].join('\n'));
          EOF
          node /tmp/summary.cjs "$PWD/coverage/coverage-summary.json" >> "$GITHUB_STEP_SUMMARY"

  format:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - run: dotnet restore app.sln

      # `style` rather than `whitespace`: whitespace-only reformatting of a codebase with a
      # consistent hand style buys nothing and destroys git blame.
      - run: dotnet format style app.sln --verify-no-changes --no-restore

      # The number that sizes the nullable ratchet in Directory.Build.props. Nobody has been able
      # to run a build locally (no .NET SDK in the web sandbox), so this is where the backlog
      # first becomes visible.
      - name: Count build warnings
        if: always()
        run: |
          dotnet build app.sln --no-restore -warnaserror 2>&1 | tee /tmp/build.log || true
          {
            echo '### C# build warnings'
            echo ''
            echo "Total: $(grep -c 'warning CS' /tmp/build.log || echo 0)"
            echo ''
            echo '```'
            grep -o 'warning CS[0-9]*' /tmp/build.log | sort | uniq -c | sort -rn || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  migrations:
    name: Migrations
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - run: dotnet tool restore
      - run: dotnet restore app.sln

      # Editing an entity or OnModelCreating without generating a migration produces a fully
      # green build and then fails at runtime on someone else's machine. Nothing else catches
      # it: Database.Migrate() only applies the migration files that exist, so a stale model
      # just means EF's queries quietly drift from the schema.
      #
      # Advisory for now because this command can report spuriously across EF patch versions.
      # Promote it into the API job in ci.yml once it has proven stable.
      - name: Check for model changes with no migration
        run: dotnet ef migrations has-pending-model-changes --project MoneyManager.Api
