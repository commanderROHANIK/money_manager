# Advisory checks. These are deliberately NOT in ci.yml and must never be added to the required
# status checks until the codebase is clean enough for them to pass.
#
# On why this is a separate workflow rather than `continue-on-error: true` in ci.yml:
# continue-on-error makes GitHub report the job as *successful*. The PR then says "all checks
# have passed", the annotation goes unread, and if the job is later promoted to required it is
# structurally incapable of failing. A separate, non-required workflow fails honestly — a red X
# on the PR — while branch protection, which blocks only on the check names you list, still lets
# the merge through. Visible but not blocking is what advisory should mean.
#
# Promotion path: when a check here goes green and stays green, delete its job from this file and
# add the equivalent step to the matching job in ci.yml. That promotes it to blocking without
# touching branch protection, because the required check name (API / UI) does not change.
#
# Already promoted this way, and no longer here:
#   Lint     -> `npm run lint` in ci.yml's UI job, once the tree reached 0 warnings.
#   Coverage -> `npm run test:coverage` in the same job, with thresholds in vitest.config.ts.
# The ratchet works. What remains below is what has not cleared yet.

name: Quality

on:
  push:
    branches: [main]
  # `labeled` and `unlabeled` are added on purpose. The default trigger types are opened,
  # synchronize and reopened, so without these the Gate changes job below could never go green:
  # adding the label it asks for would not re-run anything, and you would need an unrelated
  # push to clear a check that was already satisfied.
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # An agent that can edit the workflows can switch off the checks that would have caught it,
  # and the diff for that looks much like any other diff. This makes it loud instead.
  #
  # It is the practical substitute for CODEOWNERS on this repo: "require review from Code
  # Owners" cannot be enforced while there is a single collaborator, because GitHub will not
  # let you be a required reviewer of your own pull request. A label is something the author
  # has to consciously add, which is the acknowledgement CODEOWNERS would otherwise force.
  gates:
    name: Gate changes
    # Labels exist only on pull requests. On a push to main there is nothing left to acknowledge.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # fetch-depth: 0 is load-bearing. The default checkout is shallow, so `origin/<base>` is
      # either missing or stale, and a three-dot diff against a stale base silently reports
      # files the pull request never touched.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require the ci-change label when the gates themselves are edited
        env:
          BASE: ${{ github.base_ref }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ' ') }}
        run: |
          changed=$(git diff --name-only "origin/$BASE...HEAD" -- \
            .github .claude Directory.Build.props money-manager-ui/eslint.config.js)

          if [ -z "$changed" ]; then
            echo "No changes to the checks or the agent configuration."
            exit 0
          fi

          echo "This pull request changes the checks that guard it:"
          echo "$changed" | sed 's/^/  /'
          echo ""

          # Space-padded match so 'ci-changes' or 'no-ci-change' cannot satisfy it.
          case " $LABELS " in
            *" ci-change "*)
              echo "Labelled ci-change - acknowledged."
              ;;
            *)
              echo "Add the 'ci-change' label to confirm this is intentional."
              echo "The label is the acknowledgement, not an approval - it exists so that"
              echo "weakening a check is a deliberate act rather than an unnoticed one."
              exit 1
              ;;
          esac

  format:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - run: dotnet restore app.sln

      # `style` rather than `whitespace`: whitespace-only reformatting of a codebase with a
      # consistent hand style buys nothing and destroys git blame.
      - run: dotnet format style app.sln --verify-no-changes --no-restore

      # Kept as a trend line, not a gate. The first run reported zero warnings, which is what
      # allowed TreatWarningsAsErrors to go straight to true in Directory.Build.props — so the
      # real enforcement now lives in the required API job, and any regression fails there.
      # This step stays because a visible number is what stops an advisory check from becoming
      # wallpaper, and it still reports if the count ever moves.
      - name: Count build warnings
        if: always()
        run: |
          dotnet build app.sln --no-restore 2>&1 | tee /tmp/build.log || true
          {
            echo '### C# build warnings'
            echo ''
            echo "Total: $(grep -c 'warning CS' /tmp/build.log || echo 0)"
            echo ''
            echo '```'
            grep -o 'warning CS[0-9]*' /tmp/build.log | sort | uniq -c | sort -rn || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  migrations:
    name: Migrations
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - run: dotnet tool restore
      - run: dotnet restore app.sln

      # Editing an entity or OnModelCreating without generating a migration produces a fully
      # green build and then fails at runtime on someone else's machine. Nothing else catches
      # it: Database.Migrate() only applies the migration files that exist, so a stale model
      # just means EF's queries quietly drift from the schema.
      #
      # Advisory for now because this command can report spuriously across EF patch versions.
      # Promote it into the API job in ci.yml once it has proven stable.
      - name: Check for model changes with no migration
        run: dotnet ef migrations has-pending-model-changes --project MoneyManager.Api
