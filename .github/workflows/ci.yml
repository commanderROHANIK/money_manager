name: CI

on:
  push:
    branches: [main]
  pull_request:

# The default token scope is broader than anything here needs. A workflow change authored by an
# agent should not be able to push, comment, or cut a release.
permissions:
  contents: read

# Agents push repeatedly to the same branch while iterating, and without this each push queues
# another full run. Only cancel on pull requests: cancelling on main would leave the default
# branch with no completed run against its head.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  api:
    name: API
    runs-on: ubuntu-latest
    # Raised from 6 when the image build joined this job, and from 12 when the end-to-end suite
    # did. Each addition brought work that is slow from a cold cache — a Vite build and a dotnet
    # publish for the image, then a second npm ci and a browser download for the suite — and the
    # ceiling has to clear the slowest plausible runner, or it starts reporting congestion as a
    # defect.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '9.0.x'

      # setup-dotnet's own `cache: true` requires a packages.lock.json, and lock files are a bad
      # trade here: they freeze the whole resolved graph including the Microsoft.IdentityModel.*
      # set that MoneyManager.Api.csproj deliberately leaves unpinned. Caching on the csproj hash
      # gets the same speedup without introducing that trap.
      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - run: dotnet tool restore
      - run: dotnet restore app.sln
      - run: dotnet build app.sln --no-restore --configuration Release
      - run: dotnet test app.sln --no-build --configuration Release --verbosity normal

      # Promoted from the advisory Quality workflow after five consecutive green runs.
      #
      # `style` rather than `whitespace`: whitespace-only reformatting of a codebase with a
      # consistent hand style buys nothing and destroys git blame.
      - run: dotnet format style app.sln --verify-no-changes --no-restore

      # The cheapest high-value check here. Editing an entity or OnModelCreating without
      # generating a migration produces a completely green build and then fails at runtime on
      # someone else's machine — Database.Migrate() only applies the migration files that exist,
      # so a stale model just means EF's queries quietly drift from the schema. Nothing else
      # catches it, including the tests.
      - name: Check for model changes with no migration
        run: dotnet ef migrations has-pending-model-changes --project MoneyManager.Api

      # The image is a third build path, and until now nothing exercised it: this job compiles
      # the API and the UI job builds the bundle, but neither assembles the artifact that
      # actually gets deployed. Its failure modes are invisible to both and would first appear
      # on a deploy —
      #
      #   - a stale obj/ from the build context landing on top of the restore layer, which fails
      #     as NETSDK1064 for packages that are present;
      #   - Directory.Build.props not reaching the SDK stage, so the image builds green under
      #     laxer rules than this job enforces;
      #   - a narrowed UI copy, which breaks vue-tsc because tsconfig.node.json pulls
      #     vitest.config.ts into the build graph.
      #
      # It lives in this job rather than a job of its own on purpose. A new job would report as a
      # new check name, and every check promoted into this workflow so far has been folded into
      # API or UI precisely so branch protection keeps blocking on those two and never needs
      # editing. A separate "Image" check would be advisory by default, which is the opposite of
      # what a build path nothing else covers deserves.
      - name: Build the deployment image
        run: docker build --tag moneymanager:ci .

      # The end-to-end suite, run against the image built immediately above rather than against
      # `dotnet run` plus a Vite dev server.
      #
      # That choice is the point of it. The container is where the two halves meet on one origin,
      # and the defects that only appear there are exactly the ones no other check can see: the
      # SPA fallback's {*path:nonfile} pattern meeting the deny-by-default FallbackPolicy, static
      # files registered after UseAuthorization so every asset 401s behind an index.html that
      # still loads, wwwroot resolving off a ContentRoot that does not match WORKDIR. A dev server
      # serves the bundle itself and so passes through all of them.
      #
      # It also runs with ASPNETCORE_ENVIRONMENT unset, which is what the image ships and what a
      # deployment must use — so the suite exercises the production pipeline, not the developer
      # exception page.
      #
      # Like the image build, this lives in the API job rather than a job of its own so the
      # required check names stay API and UI and branch protection never needs editing.
      - name: Start the deployment image
        env:
          # Deliberately literal, not repository secrets. They configure a container that lives
          # for the length of this job, holds nothing but fabricated demo records, and is not
          # reachable from outside the runner. Storing them as secrets would imply they protect
          # something, and would leave this file describing a run nobody can reproduce.
          SEED_PASSWORD: e2e-demo-password
          JWT_KEY: e2e-only-signing-key-not-a-secret-0123456789
        run: |
          docker run --detach --name moneymanager-e2e \
            --publish 8080:8080 \
            --env ASPNETCORE_HTTP_PORTS=8080 \
            --env 'ConnectionStrings__Default=Data Source=/tmp/e2e.db' \
            --env "JwtSettings__SecretKey=$JWT_KEY" \
            --env Seed__Enabled=true \
            --env "Seed__Password=$SEED_PASSWORD" \
            --env Features__AutomaticExchangeRates=false \
            --env "Logging__LogLevel__Microsoft.EntityFrameworkCore=Warning" \
            moneymanager:ci

      # The suite fetches no rates: the flag above registers NoExchangeRateProvider, so there is
      # no HttpClient and no DNS lookup, the same posture ApiFactory takes for the API tests. The
      # seeded EUR/HUF rate is a manual row, so the converted total under test does not depend on
      # the runner being able to reach the ECB.
      - name: Wait for the container to answer
        run: |
          for _ in $(seq 1 60); do
            if curl --fail --silent --show-error http://localhost:8080/health > /dev/null 2>&1; then
              echo "Container is answering."
              exit 0
            fi
            sleep 2
          done
          echo "::error::The container never answered /health."
          docker logs moneymanager-e2e
          exit 1

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: money-manager-ui/package-lock.json

      - name: Install UI dependencies
        working-directory: money-manager-ui
        run: npm ci

      # Only chromium. The suite asserts what the seeded data renders as, which is not a
      # cross-browser question, and installing three engines would add minutes to every run.
      - name: Install the browser
        working-directory: money-manager-ui
        run: npx playwright install --with-deps chromium

      - name: Run the end-to-end suite
        working-directory: money-manager-ui
        env:
          E2E_BASE_URL: http://localhost:8080
          E2E_PASSWORD: e2e-demo-password
        run: npm run test:e2e

      # The container's own log is usually the answer when the suite fails to log in or the page
      # comes up empty, and it is gone the moment the runner is reclaimed.
      #
      # Tailed, and with EF's command logging turned down where the container starts. Dumping it
      # whole put roughly a thousand lines of SELECT between the reader and the Playwright output
      # immediately above it, which is how a step meant to aid diagnosis ends up preventing it.
      - name: Container logs
        if: failure()
        run: docker logs --tail 200 moneymanager-e2e

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: money-manager-ui/playwright-report/
          retention-days: 7

  ui:
    name: UI
    runs-on: ubuntu-latest
    timeout-minutes: 6
    defaults:
      run:
        working-directory: money-manager-ui
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: money-manager-ui/package-lock.json
      - run: npm ci

      # Promoted from the advisory Quality workflow once the codebase reached zero findings.
      # `npm run lint` carries --max-warnings 0, so a new warning fails here rather than joining
      # a backlog. vue/no-undef-components is the rule that earns this its place: it catches a
      # template using a component the script never imported, which vue-tsc and vite build both
      # pass cleanly, and which has shipped broken in this repo before.
      - run: npm run lint

      # Its own step so a type error reports as "Typecheck" rather than being buried in a failing
      # build. `npm run build` runs vue-tsc again, but incrementally against the tsbuildinfo this
      # step just wrote, so the second pass costs a couple of seconds.
      # It must be `vue-tsc -b`, not `--noEmit`: tsconfig.json is a solution-style stub with
      # "files": [], so a non-build invocation would typecheck nothing at all.
      - run: npm run typecheck

      - run: npm run build

      # The build does not catch a template referencing a component the script never imported —
      # that only surfaces when the component is mounted. npm test mounts every widget.
      #
      # Runs with coverage so the thresholds in vitest.config.ts apply: a change that deletes
      # coverage fails here. Also promoted from the Quality workflow.
      - run: npm run test:coverage

      # Runs even when an earlier step failed, so a red build still reports its coverage — but
      # only if the file exists. On a failure before the tests ran there is no summary to read,
      # and require() would throw MODULE_NOT_FOUND, adding a second red step pointing at the
      # wrong cause.
      - name: Report coverage
        if: always() && hashFiles('money-manager-ui/coverage/coverage-summary.json') != ''
        run: |
          cat > /tmp/summary.cjs <<'EOF'
          const t = require(process.argv[2]).total;
          const rows = ['statements', 'branches', 'functions', 'lines']
            .map((k) => `| ${k} | ${t[k].pct}% | ${t[k].covered}/${t[k].total} |`);
          console.log(['### UI coverage', '', '| Metric | % | Covered |', '|---|---|---|', ...rows].join('\n'));
          EOF
          node /tmp/summary.cjs "$PWD/coverage/coverage-summary.json" >> "$GITHUB_STEP_SUMMARY"
